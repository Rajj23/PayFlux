spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
        - id: user-service-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/transactions/**
        - id: reward-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/rewards/**
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
        - id: wallet-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/wallets/**

FRONTEND_URL: http://localhost:3000
JWT_SECRET: ci-only-secret-key-that-is-at-least-32-bytes-long