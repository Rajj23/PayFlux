services:
  api-gateway:
    ports: !reset []

  frontend:
    ports: !reset []

  server-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: ${PROXY_MEMORY_LIMIT:-64m}
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy