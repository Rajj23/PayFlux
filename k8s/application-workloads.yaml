apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: payflux
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:4.3.1
          command:
            - /bin/sh
            - -ec
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "Waiting for Kafka metadata..."
                sleep 5
              done
      containers:
        - name: notification-service
          image: payflux/notification-service:demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: payflux-config
            - secretRef:
                name: payflux-secrets
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: payflux
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8084
      targetPort: http
---
