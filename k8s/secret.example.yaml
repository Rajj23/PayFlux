# Demo-only template. Replace every value before applying; do not commit real credentials.
# Create the live Secret with:
#   kubectl create secret generic payflux-secrets -n payflux \
#     --from-literal=DB_USERNAME='...' --from-literal=DB_PASSWORD='...' \
#     --from-literal=JWT_SECRET='at-least-32-random-bytes'
apiVersion: v1
kind: Secret
metadata:
  name: payflux-secrets
  namespace: payflux
type: Opaque
stringData:
  DB_USERNAME: replace-me
  DB_PASSWORD: replace-with-a-strong-password
  JWT_SECRET: replace-with-at-least-32-random-bytes