apiVersion: v1
kind: Pod
metadata:
  name: data-layer-smoke-test
  namespace: payflux
  labels:
    app.kubernetes.io/name: data-layer-smoke-test
spec:
  restartPolicy: Never
  containers:
    - name: postgres
      image: postgres:16-alpine
      command: ["sh", "-c"]
      args:
        - >-
          until pg_isready -h "$POSTGRES_HOST" -p 5432 -U "$DB_USERNAME" -d payflux; do sleep 2; done;
          PGPASSWORD="$DB_PASSWORD" psql "host=$POSTGRES_HOST port=5432 dbname=payflux user=$DB_USERNAME sslmode=require" -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null;
          echo 'PostgreSQL connection OK'; sleep 3600
      env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: payflux-config
              key: POSTGRES_HOST
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: payflux-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payflux-secrets
              key: DB_PASSWORD
    - name: redis
      image: redis:7-alpine
      command: ["sh", "-c"]
      args:
        - >-
          until redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" PING; do sleep 2; done;
          test "$(redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" SET payflux-smoke-test ok)" = OK;
          test "$(redis-cli -h "$REDIS_HOST" -p "$REDIS_PORT" GET payflux-smoke-test)" = ok;
          echo 'Redis SET/GET OK'; sleep 3600
      env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: payflux-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: payflux-config
              key: REDIS_PORT
    - name: kafka
      image: apache/kafka:3.8.1
      command: ["sh", "-c"]
      args:
        - >-
          until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" --list >/dev/null 2>&1; do sleep 2; done;
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" --create --if-not-exists --topic payflux-connectivity-smoke-test --partitions 1 --replication-factor 2;
          echo 'Kafka metadata/topic operation OK'; sleep 3600
      env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: payflux-config
              key: KAFKA_BOOTSTRAP_SERVERS