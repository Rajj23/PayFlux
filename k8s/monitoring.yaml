apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: payflux
  labels:
    release: monitoring
    app.kubernetes.io/part-of: payflux
spec:
  namespaceSelector:
    matchNames:
      - payflux
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
  podTargetLabels:
    - app
---
