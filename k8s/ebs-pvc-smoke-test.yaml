apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-smoke-test
  namespace: payflux
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-smoke-test
  namespace: payflux
spec:
  containers:
    - name: smoke-test
      image: public.ecr.aws/docker/library/busybox:1.37
      command: ["sh", "-c", "echo ebs-ok > /data/health && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ebs-smoke-test