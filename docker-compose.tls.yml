services:
  server-nginx:
    profiles: [tls]
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config: