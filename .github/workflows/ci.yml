name: Build and test

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - wallet-service
          - transaction-service
          - notification-service
          - reward-service
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payflux
          POSTGRES_USER: payflux
          POSTGRES_PASSWORD: payflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflux -d payflux"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test service
        working-directory: ${{ matrix.service }}
        env:
          DB_URL: jdbc:postgresql://localhost:5432/payflux
          DB_USERNAME: payflux
          DB_PASSWORD: payflux
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-only-secret-key-that-is-at-least-32-bytes-long
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fronted_new/package-lock.json
      - name: Build frontend
        working-directory: fronted_new
        env:
          API_INTERNAL_URL: ${{ vars.API_INTERNAL_URL || 'http://api-gateway:8080' }}
        run: npm ci && npm run build

  publish-images:
    name: Publish ${{ matrix.name }} to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: api-gateway
          - name: user-service
            context: user-service
          - name: wallet-service
            context: wallet-service
          - name: transaction-service
            context: transaction-service
          - name: notification-service
            context: notification-service
          - name: reward-service
            context: reward-service
          - name: frontend
            context: fronted_new
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/rajj23/payflux-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/rajj23/payflux-${{ matrix.name }}:latest
          build-args: |
            API_INTERNAL_URL=${{ vars.API_INTERNAL_URL || 'http://api-gateway:8080' }}
